{% extends "base.html" %}
{% block title %}Login Administrativo - {{ site_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl border border-gray-100 shadow-sm p-8 mt-10">
    <div class="text-center mb-6">
        <div class="w-12 h-12 bg-shopee/10 text-shopee rounded-full flex items-center justify-center mx-auto mb-3 text-lg font-bold">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-900">Área Administrativa</h1>
        <p class="text-xs text-gray-500 mt-1">Digite sua senha para gerenciar os produtos.</p>
    </div>

    <form method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Senha de Acesso</label>
            <input type="password" name="password" required autofocus class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:border-shopee text-sm">
        </div>
        <button type="submit" class="w-full bg-shopee hover:bg-shopeeDark text-white font-bold py-2.5 rounded-xl transition text-sm shadow-sm">
            Entrar no Painel
        </button>
    </form>
</div>
{% endblock %}
