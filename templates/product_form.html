{% extends "base.html" %}{% block title %}Produto — ACHADINHOS{% endblock %}{% block content %}
<section class="container form-page"><small>CATÁLOGO</small><h1>{% if product %}Editar produto{% else %}Adicionar produto{% endif %}</h1>
<form method="post" class="form-grid"><div><label>Nome do produto *</label><input name="name" value="{{product.name if product else ''}}" required><div class="two"><div><label>Preço *</label><input name="price" value="{{product.price if product else ''}}" required></div><div><label>Preço antigo</label><input name="old_price" value="{{product.old_price if product else ''}}"></div></div><label>Descrição</label><textarea name="description" rows="6">{{product.description if product else ''}}</textarea><label>Link de afiliado *</label><input type="url" name="affiliate_url" value="{{product.affiliate_url if product else ''}}" required></div>
<div><label>Imagem *</label><input type="url" name="image_url" value="{{product.image_url if product else ''}}" required><label>Categoria</label><select name="category">{% for c in categories if c!='Todos' %}<option {% if product and product.category==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select><label>Loja / plataforma</label><input name="store" value="{{product.store if product and product.store else 'Shopee'}}"><label class="check"><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %}> Mostrar como destaque</label></div>
<div class="form-actions"><a class="btn" href="{{url_for('admin')}}">Cancelar</a><button class="btn dark">Salvar produto</button></div></form></section>{% endblock %}
